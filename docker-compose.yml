services:
  postgres:
    image: postgres:16-alpine
    container_name: video-sum-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: video_sum
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d video_sum"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
